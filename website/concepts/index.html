<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotator website: Daylight</title>
  <link rel="icon" type="image/svg+xml" href="/public/mark.svg">
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("/concepts/shared/fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/concepts/shared/fonts/geist-mono-normal.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 5vw, 72px); background: #0d0f14; color: #f2f3f7; font: 400 18px/1.5 "Bricolage Grotesque", sans-serif; }
    h1 { margin: 0 0 12px; font-size: clamp(40px, 6vw, 84px); line-height: .98; letter-spacing: -.045em; font-weight: 750; }
    h1 span { color: #ffb58c; }
    .intro { max-width: 60ch; margin: 0 0 56px; color: #b1b7c6; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 28px; }
    .card { display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-radius: 26px; background: #161922; box-shadow: 0 0 0 1px #ffffff1c; color: inherit; text-decoration: none; transition: transform .35s cubic-bezier(.16, 1, .3, 1), box-shadow .35s ease; }
    .card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 0 0 1.5px #ffb58c, 0 40px 80px -40px #000; outline: none; }
    .shot { aspect-ratio: 16 / 10; overflow: hidden; background: #0a0c10; }
    .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .8s cubic-bezier(.16, 1, .3, 1); }
    .card:hover .shot img { transform: scale(1.04); }
    .body { padding: 26px 28px 30px; }
    .tag { color: #ffb58c; font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .family { margin-bottom: 72px; }
    .family-title { margin: 0 0 6px; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.05; letter-spacing: -.035em; font-weight: 750; }
    .family-note { margin: 0 0 28px; color: #b1b7c6; }
    .card h2 { margin: 12px 0 8px; font-size: 38px; line-height: 1; letter-spacing: -.04em; font-weight: 750; }
    .card p { margin: 0 0 16px; color: #b1b7c6; }
    .card .story { margin-bottom: 8px; color: #f2f3f7; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 16px; }
    li { padding-left: 22px; position: relative; }
    li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 9px; height: 9px; border-radius: 50%; background: #ffb58c; }
    .foot { margin-top: 48px; color: #848b9c; font-size: 16px; max-width: 70ch; }
    @media (prefers-reduced-motion: reduce) { .card, .shot img { transition: none; } }
  </style>
</head>
<body>
  <h1>The new <span>getannotator.app</span></h1>
  <p class="intro">Daylight, the chosen design. It runs from this computer only.</p>
  <main>
    <div class="grid">
    <a class="card" href="i-daylight/">
      <div class="shot"><img src="shots/i.jpg" alt="" loading="lazy"></div>
      <div class="body">
        <span class="tag">Daylight</span>
        <h2>Daylight</h2>
        <p class="story">Draw on your screen.</p>
        <p>The live demo on the first screen, four things you can do, coffee and install. Dark and light, with the app's gradients.</p>
      </div>
    </a>
    </div>
  </main>
</body>
</html>
