<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotator web demo: the three small scenes</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ink.css">
<style>
  :root { color-scheme: dark; --page: #101216; --text: #e9ecf2; --muted: #9aa2b3; --frame: #ffffff24; }
  :root[data-appearance="light"] { color-scheme: light; --page: #f6f4ef; --text: #17181b; --muted: #5c6270; --frame: #00000024; }
  html { overflow-x: clip; }
  body { margin: 0; padding: 20px; font: 15px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--page); }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 14px; max-width: 76ch; color: var(--muted); }
  .switches { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 18px; }
  .switches label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  select, button { padding: 6px 10px; border: 1px solid var(--frame); border-radius: 8px; font: inherit; color: inherit; background: transparent; }
  .scenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 18px; }
  figure { margin: 0; }
  /* The page's own frame: the scene fills it and takes its radius. */
  .frame { aspect-ratio: var(--shape, 16 / 10); border-radius: 16px; box-shadow: 0 0 0 1px var(--frame); }
  figcaption { margin-top: 8px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>The three small scenes</h1>
<p>Each scene fills the frame the page gives it, plays once and holds its last picture; this page plays them in a loop. The switches rebuild them. With Reduce Motion each shows its finished picture.</p>
<div class="switches">
  <label>Appearance <select id="appearance"><option>dark</option><option>light</option></select></label>
  <label>Gradient <select id="gradient"></select></label>
  <label>Shape <select id="shape"><option value="16 / 10">16:10</option><option value="4 / 3">4:3</option><option value="2 / 1">2:1</option></select></label>
  <button type="button" id="play">Play</button><button type="button" id="stop">Stop</button><button type="button" id="reset">First frame</button>
</div>
<div class="scenes">
  <figure><div class="frame" id="share"></div><figcaption>shareRegionScene</figcaption></figure>
  <figure><div class="frame" id="break"></div><figcaption>breakTimerScene</figcaption></figure>
  <figure><div class="frame" id="bar"></div><figcaption>toolbarScene</figcaption></figure>
</div>
<script type="module">
import { breakTimerScene, shareRegionScene, toolbarScene } from "./scenes.js";
import { GRADIENT_PRESETS } from "./annotation-core.js";

// ?appearance=light&gradient=ocean&shape=4/3&play=0 (play=0 leaves the first frame, play=end the finished picture)
const query = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
for (const preset of GRADIENT_PRESETS) $("gradient").append(new Option(preset.id, preset.id));
$("appearance").value = query.get("appearance") === "light" ? "light" : "dark";
$("gradient").value = GRADIENT_PRESETS.some((p) => p.id === query.get("gradient")) ? query.get("gradient") : "sunset";
if (query.get("shape")) $("shape").value = query.get("shape").replace("/", " / ");
const makers = { share: shareRegionScene, break: breakTimerScene, bar: toolbarScene };
let scenes = (window.scenes = {}), looping = 0;
function build() {
  looping++;
  Object.values(scenes).forEach((scene) => scene.destroy());
  document.documentElement.dataset.appearance = $("appearance").value;
  document.querySelector(".scenes").style.setProperty("--shape", $("shape").value);
  scenes = window.scenes = Object.fromEntries(Object.entries(makers).map(([id, make]) => [id, make($(id), { appearance: $("appearance").value, gradient: $("gradient").value })]));
}
async function loop() {
  const mine = ++looping;
  // Each scene on its own clock, with a pause before it starts over.
  await Promise.all(Object.values(scenes).map(async (scene) => { while (mine === looping && (await scene.play())) await new Promise((done) => setTimeout(done, 1800)); }));
}
build();
if (query.get("play") === "end") window.ended = Promise.all(Object.values(scenes).map((scene) => scene.play())); else if (query.get("play") !== "0") loop();
for (const id of ["gradient", "shape"]) $(id).addEventListener("change", () => { build(); loop(); });
// The appearance changes on the scenes that are there, as a page's theme switch does.
$("appearance").addEventListener("change", () => { document.documentElement.dataset.appearance = $("appearance").value; Object.values(scenes).forEach((scene) => scene.setAppearance($("appearance").value)); });
$("play").addEventListener("click", loop);
$("stop").addEventListener("click", () => { looping++; Object.values(scenes).forEach((scene) => scene.stop()); });
$("reset").addEventListener("click", () => { looping++; Object.values(scenes).forEach((scene) => scene.reset()); });
</script>
</body>
</html>
