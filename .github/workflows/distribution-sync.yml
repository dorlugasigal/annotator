name: Resume distribution metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: annotator-release
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/main' && vars.PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release-publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Repair tap from published manifests without rebuilding or replacing ZIPs
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: python3 tools/release/distribution.py tap
      - name: Request a fresh website build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main
