version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /services/metrics
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /apps/windows
    schedule:
      interval: weekly
    groups:
      windows:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools/release
    schedule:
      interval: weekly
