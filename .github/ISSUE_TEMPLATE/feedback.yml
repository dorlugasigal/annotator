name: Feature or feedback
description: Suggest a feature, or tell us what felt useful, confusing or missing.
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Annotator. This issue is public; don't include private screenshots or account details.
        Every feature ships on both Mac and Windows, so describe what you need, not one platform's controls.
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Settings > About shows it.
  - type: textarea
    id: experience
    attributes:
      label: What are you trying to do?
      description: The situation, what helped and what got in the way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you change or add?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
