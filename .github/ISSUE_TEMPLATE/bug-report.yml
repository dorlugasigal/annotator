name: Bug report
description: Something in Annotator doesn't work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use made-up content and remove private details from screenshots.
        The app doesn't attach drawings, screen captures or logs on its own.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About shows it.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Mac
        - Windows
        - Both
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and computer
      description: For example "macOS 15.5, MacBook Air M2" or "Windows 11 24H2, ARM64". No serial numbers.
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: Number of displays and their scaling, if it matters.
  - type: textarea
    id: steps
    attributes:
      label: What did you try?
      description: The steps, what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: sharing
    attributes:
      label: Screen sharing or installation details
      description: The meeting app and sharing mode and what viewers saw, or the exact installation message.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This public report has no private data or credentials.
          required: true
